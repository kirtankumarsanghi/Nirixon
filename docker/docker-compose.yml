services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirixon
      POSTGRES_PASSWORD: nirixon
      POSTGRES_DB: nirixon
    ports:
      - "5432:5432"
    volumes:
      - nirixon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirixon -d nirixon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      # Single worker only while SESSION_REPO_BACKEND=memory
      DATABASE_URL: postgresql+asyncpg://nirixon:nirixon@db:5432/nirixon
      JWT_SECRET: docker-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SESSION_REPO_BACKEND: memory
      ML_ARTIFACTS_DIR: /app/backend/ml/artifacts
      SEED_USER_EMAIL: parent@example.com
      SEED_USER_PASSWORD: changeme
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    # IMPORTANT: do not scale `api` replicas or raise --workers above 1
    # until RedisSessionRepo replaces InMemorySessionRepo.
    command: >
      sh -c "cd /app/backend &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

volumes:
  nirixon_pg:
