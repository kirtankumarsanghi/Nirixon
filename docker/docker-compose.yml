services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirixon
      POSTGRES_PASSWORD: nirixon
      POSTGRES_DB: nirixon
    ports:
      - "5432:5432"
    volumes:
      - nirixon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirixon -d nirixon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nirixon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nirixon:nirixon@db:5432/nirixon
      JWT_SECRET: docker-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,https://localhost,http://localhost,capacitor://localhost
      SESSION_REPO_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      ML_ARTIFACTS_DIR: /app/backend/ml/artifacts
      SEED_USER_EMAIL: parent@example.com
      SEED_USER_PASSWORD: changeme
      RATE_LIMIT_ENABLED: "true"
      NOTIFICATION_PROVIDER: outbox
      PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Multi-worker Uvicorn clustering supported via RedisSessionRepo
    command: >
      sh -c "cd /app/backend &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  # Single-process sweeper. Kept out of the 4-worker API so reminders are not
  # sent more than once.
  notifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nirixon:nirixon@db:5432/nirixon
      JWT_SECRET: docker-dev-secret-change-me
      ML_ARTIFACTS_DIR: /app/backend/ml/artifacts
      NOTIFICATION_PROVIDER: outbox
      PUBLIC_APP_URL: http://localhost:3000
      NOTIFICATION_SWEEP_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cd /app/backend &&
      alembic upgrade head &&
      python -m app.workers.notification_worker"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  nirixon_pg:
  nirixon_redis:
