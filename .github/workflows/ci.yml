name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-ml.txt

      - name: Install dependencies
        run: |
          pip install ruff black pytest pytest-asyncio
          pip install -r backend/requirements-ml.txt
          pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Format check (black)
        run: black --check backend/

      - name: Stage 1 — Generate synthetic data
        working-directory: backend/data/generator
        run: python generate_synthetic_data.py

      - name: Stage 1 — Verify synthetic data
        working-directory: backend/data/generator
        run: python verify_stage1.py

      - name: Stage 2 — Train ML pipeline
        working-directory: backend/ml
        run: python train.py

      - name: Stage 3 — Unit tests (no server required)
        working-directory: backend
        run: |
          python -m pytest tests/test_adaptive_logic.py -v -k "not HTTP and not Sensitivity" --tb=short

      - name: Stage 3 — HTTP integration tests (stub_api)
        working-directory: backend
        run: |
          python -m uvicorn app.stub_api:app --port 8001 --log-level warning &
          sleep 3
          python -m pytest tests/test_adaptive_logic.py -v -k "HTTP or Sensitivity" --tb=short

      - name: Stage 4 — API tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long
          RATE_LIMIT_ENABLED: "false"
          SESSION_REPO_BACKEND: memory
        run: |
          python -m pytest tests/test_api.py -v --tb=short

  frontend:
    name: Stage 5 — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx vite build
