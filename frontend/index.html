<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirixon — Developmental Screening</title>
    <meta name="description" content="Nirixon turns a five-minute developmental check-in into a clear next step for families, community health workers and clinicians." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#fff4dc" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicon: the Nirixon mark, inlined so it works from a single-file build -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%232b2116' stroke='%23f7efe0' stroke-opacity='.35' stroke-width='1.5'/%3E%3Cg fill='none' stroke='%23f7efe0' stroke-width='6.4' stroke-linejoin='miter'%3E%3Cpath d='M17 34V14'/%3E%3Cpath d='M17 14 31 34'/%3E%3Cpath d='M31 34V14'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='3.6' fill='%23dd5f24'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%232b2116'/%3E%3Cg fill='none' stroke='%23f7efe0' stroke-width='6.4' stroke-linejoin='miter'%3E%3Cpath d='M17 34V14'/%3E%3Cpath d='M17 14 31 34'/%3E%3Cpath d='M31 34V14'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='3.6' fill='%23dd5f24'/%3E%3C/svg%3E" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nirixon — Developmental Screening" />
    <meta property="og:description" content="A five-minute check-in becomes a clear next step — for families, health workers and clinicians." />
    <meta name="twitter:card" content="summary" />

    <script>
      /* Apply the saved theme before paint so the page never flashes the wrong palette. */
      (function () {
        try {
          var saved = localStorage.getItem("nirixon-theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #211709">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem">Nirixon needs JavaScript</h1>
        <p style="line-height: 1.6">
          This prototype is an interactive application. Please enable JavaScript in your browser to open the
          developmental check-in workspaces.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
