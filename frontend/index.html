<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirixon — Developmental Screening</title>
    <meta name="description" content="Nirixon turns a five-minute developmental check-in into a clear next step for families, community health workers and clinicians." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#fff4dc" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon: the Nirixon mark, inlined so it works from a single-file build -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%232b2116' stroke='%23f7efe0' stroke-opacity='.35' stroke-width='1.5'/%3E%3Cg fill='none' stroke='%23f7efe0' stroke-width='6.4' stroke-linejoin='miter'%3E%3Cpath d='M17 34V14'/%3E%3Cpath d='M17 14 31 34'/%3E%3Cpath d='M31 34V14'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='3.6' fill='%23dd5f24'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%232b2116'/%3E%3Cg fill='none' stroke='%23f7efe0' stroke-width='6.4' stroke-linejoin='miter'%3E%3Cpath d='M17 34V14'/%3E%3Cpath d='M17 14 31 34'/%3E%3Cpath d='M31 34V14'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='3.6' fill='%23dd5f24'/%3E%3C/svg%3E" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nirixon — Developmental Screening" />
    <meta property="og:description" content="A five-minute check-in becomes a clear next step — for families, health workers and clinicians." />
    <meta name="twitter:card" content="summary" />

    <script>
      /* Apply the saved theme before paint so the page never flashes the wrong palette. */
      (function () {
        try {
          var saved = localStorage.getItem("nirixon-theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* If the bundle fails before React mounts, show the real error instead of
         a blank screen (especially useful inside the Android WebView). */
      (function () {
        window.__nrxError = null;
        window.addEventListener("error", function (e) {
          window.__nrxError =
            (e && (e.message || (e.error && e.error.message))) ||
            "A script failed to load.";
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          window.__nrxError = r && (r.message || r) ? String(r.message || r) : "Unhandled promise rejection.";
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || root.children.length > 0) return;
          var msg = String(window.__nrxError || "No error message was reported.");
          msg = msg.replace(/[<>&]/g, function (c) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
          });
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff4dc;color:#211709;font-family:system-ui,sans-serif">' +
            '<div style="max-width:32rem"><h1 style="font-size:20px;margin:0 0 8px">Nirixon could not start</h1>' +
            '<p style="line-height:1.5;margin:0 0 10px">The app shell loaded but the interface did not mount.</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#211709;color:#f7efe0;padding:12px;border-radius:8px;font-size:12px">' +
            msg +
            "</pre></div></div>";
        }, 6000);
      })();
    </script>
    <noscript>
      <div style="max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #211709">
        <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem">Nirixon needs JavaScript</h1>
        <p style="line-height: 1.6">
          This prototype is an interactive application. Please enable JavaScript in your browser to open the
          developmental check-in workspaces.
        </p>
      </div>
    </noscript>
    <script type="module">
      /* The dev server must never run under a service worker: a stale worker
         serves old modules cache-first and can break the app with errors such
         as "jsxDEV is not a function". Clear any worker left by earlier runs. */
      if (import.meta.env.DEV && "serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) {
            reg.unregister();
          });
        });
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
